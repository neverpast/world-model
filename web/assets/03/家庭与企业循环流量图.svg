<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">家庭与企业之间的双向循环流量</title>
  <desc id="desc">家庭和企业通过产品市场与要素市场交换。绿色箭头表示实物流，黄色箭头表示反向的货币流。</desc>
  <defs>
    <marker id="realArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b8b78"/></marker>
    <marker id="moneyArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d49a22"/></marker>
    <style>
      .bg{fill:#f7f4ec}.node{fill:#fffdf8;stroke:#cfc8ba;stroke-width:1.5}.market{fill:#eef4ef;stroke:#b9ccc3;stroke-width:1.5}.title{fill:#15221e;font:600 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.head{fill:#15221e;font:600 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.label{fill:#26332f;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.small{fill:#66716c;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.realText{fill:#2b8b78}.moneyText{fill:#b77d00}.real{fill:none;stroke:#2b8b78;stroke-width:4;marker-end:url(#realArrow)}.money{fill:none;stroke:#d49a22;stroke-width:4;marker-end:url(#moneyArrow)}.legendReal{fill:#2b8b78}.legendMoney{fill:#d49a22}.extension{fill:#fffdf8;stroke:#d8d2c5;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect class="bg" width="960" height="560" rx="18"/>
  <text class="title" x="480" y="42" text-anchor="middle">家庭—企业双向循环</text>

  <rect class="node" x="48" y="205" width="190" height="112" rx="18"/>
  <text class="head" x="143" y="248" text-anchor="middle">家庭</text>
  <text class="small" x="143" y="275" text-anchor="middle">拥有要素 · 消费产品</text>

  <rect class="node" x="722" y="205" width="190" height="112" rx="18"/>
  <text class="head" x="817" y="248" text-anchor="middle">企业</text>
  <text class="small" x="817" y="275" text-anchor="middle">购买要素 · 生产产品</text>

  <rect class="market" x="378" y="82" width="204" height="58" rx="29"/>
  <text class="head" x="480" y="117" text-anchor="middle">产品市场</text>
  <rect class="market" x="378" y="374" width="204" height="58" rx="29"/>
  <text class="head" x="480" y="409" text-anchor="middle">要素市场</text>

  <path class="real" d="M722 219 C648 143 601 116 583 113"/>
  <path class="real" d="M377 113 C337 119 280 151 229 218"/>
  <text class="label realText" x="635" y="130">商品与服务</text>

  <path class="money" d="M236 244 C309 184 349 162 392 142"/>
  <path class="money" d="M568 142 C616 164 661 187 724 244"/>
  <text class="label moneyText" x="268" y="173">消费支出</text>

  <path class="real" d="M229 302 C288 353 334 381 378 396"/>
  <path class="real" d="M582 396 C627 380 669 352 729 301"/>
  <text class="label realText" x="270" y="363">劳动 · 土地 · 资本</text>

  <path class="money" d="M724 278 C664 327 618 353 568 373"/>
  <path class="money" d="M392 373 C349 355 302 326 236 278"/>
  <text class="label moneyText" x="623" y="356">工资 · 租金 · 利息 · 利润</text>

  <circle class="legendReal" cx="302" cy="477" r="6"/>
  <text class="label" x="317" y="482">实物流</text>
  <circle class="legendMoney" cx="422" cy="477" r="6"/>
  <text class="label" x="437" y="482">货币流</text>

  <rect class="extension" x="570" y="458" width="342" height="70" rx="12"/>
  <text class="small" x="588" y="484">扩展部门：金融体系 · 政府 · 国外</text>
  <text class="label" x="588" y="512">漏出 S / T / M　↔　注入 I / G / X</text>
</svg>
